name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up template leftovers
        run: |
          sed -i '/libxposed-compat/d' settings.gradle.kts || true
          sed -i '/libxposed-compat/d' settings.gradle || true
          sed -i '/libxposed-compat/d' app/build.gradle.kts || true
          sed -i '/libxposed-compat/d' app/build.gradle || true
          rm -rf app/src/main/java/org/ || true
          rm -rf app/src/main/java/com/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Extera-iOS-Module
          path: app/build/outputs/apk/**/*.apk
